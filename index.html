<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Shreyan's Arc | DSA Roadmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            dark: {
              bg: '#0e0e11',       // Deep premium dark gray
              card: '#16161a',     // Elevated card surface
              cardMuted: '#121215',// Recessed card surface
              border: '#26262d',   // Crisp card border
              highlight: '#24242c',// Hover state
              text: '#ededf0',     // Warm off-white (eliminates eye strain & halation)
              muted: '#94949f',    // Warm secondary zinc
              subtle: '#64646f',   // Warm tertiary subtle
            },
            brand: {
              primary: '#3b82f6',      // Accent blue
              primaryHover: '#2563eb', // Active blue
              secondary: '#6366f1',    // Indigo
              accent: '#10b981',       // Emerald
              accentMuted: '#064e3b',  // Muted emerald
              danger: '#ef4444',       
              warning: '#f59e0b',      
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out',
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(16px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    html,
    body {
      overscroll-behavior: none;
      background-color: #0e0e11;
      color: #ededf0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }

    /* Tabular figures for monospace counts and stats to prevent jitter */
    .font-mono {
      font-feature-settings: normal;
      font-variant-numeric: tabular-nums;
    }

    /* Clean Solid Canvas Background */
    .grid-bg {
      background-color: #0e0e11;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #121214;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272c;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #36363e;
    }

    /* Checkbox Animation */
    .checkbox-wrapper input:checked+div {
      background-color: #10b981;
      border-color: #10b981;
    }

    .checkbox-wrapper input:checked+div svg {
      display: block;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
